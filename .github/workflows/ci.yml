name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash scripts/test.sh
      - run: RECLAIM_UNIVERSAL=1 bash scripts/build.sh
      - run: '"dist/Reclaim Dev.app/Contents/MacOS/Reclaim Dev" --diagnostics'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Reclaim-Dev-universal
          path: dist/
          if-no-files-found: error
